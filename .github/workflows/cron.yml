name: Run at every hour

on:
  schedule:
    - cron: '0 * * * *'  # 每小时整点运行
  workflow_dispatch:      # 可手动触发

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: main_script
        run: python main.py